odometry_fusion:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    # The hardware driver must publish /odom/wheel, but not odom -> base_link.
    publish_tf: true
    publish_acceleration: false

    odom0: /odom/wheel
    odom0_queue_size: 20
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]

    # Fuse IMU yaw rate only until mounting and orientation calibration are
    # verified. Do not fuse uncalibrated absolute yaw or linear acceleration.
    imu0: /imu/data
    imu0_queue_size: 20
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
