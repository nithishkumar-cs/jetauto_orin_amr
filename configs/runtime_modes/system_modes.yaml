# Mode selection + node toggles.
# Mode *behavior* (log level, assertions, CUDA timing, metrics, detector backend)
# lives in runtime_modes.yaml.
#
# Required toggles are locked on in production. In debug/profile, false selects
# an empty synthetic perception source or a zero-command safety source.
# drivers=false leaves motion to an external simulator/bag edge or no actuator.
# Variant choices must pass bringup's validated-combination checks.

default_mode: debug

toggles:
  drivers:               true
  detector:              true
  geometry:              true
  lidar_clustering:       true
  tracking:              true
  fusion:                true
  safety:                true
  localization:          true
  navigation:            false
  teleop:                false
  diagnostics:           true
  benchmarks:            true
  calibration_validator: true
