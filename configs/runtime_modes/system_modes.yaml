# Mode selection + node toggles.
# Mode *behavior* (log level, assertions, CUDA timing, metrics, detector backend)
# lives in runtime_modes.yaml.
#
# toggles apply to debug and profile only. false => the node is replaced by a
# synthetic source (drivers=false => rosbag / sim bridge). safety=false is allowed
# only when drivers=false. production ignores toggles and runs the full stack.

default_mode: debug

toggles:
  drivers:               true
  preproc:               true
  detector:              true
  geometry:              true
  tracking:              true
  fusion:                true
  safety:                true
  localization:          true
  navigation:            true
  teleop:                true
  diagnostics:           true
  benchmarks:            true
  calibration_validator: true
