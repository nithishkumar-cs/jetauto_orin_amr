calibration_set:
  name: default_dev_calibration
  status: placeholder_until_hardware_measurement
  owner_package: tf_and_calibration

required_files:
  frames: src/platform/tf_and_calibration/config/frames.yaml
  validator: src/platform/tf_and_calibration/config/calibration_validator.yaml

required_transforms:
  - parent: base_link
    child: rgb_camera_link
    source: frames.yaml
    measured: false
  - parent: base_link
    child: depth_camera_link
    source: frames.yaml
    measured: false
  - parent: base_link
    child: lidar_link
    source: frames.yaml
    measured: false

validation:
  require_camera_info: true
  require_static_tf: true
  max_camera_info_age_ms: 1000
  max_tf_lookup_age_ms: 1000
