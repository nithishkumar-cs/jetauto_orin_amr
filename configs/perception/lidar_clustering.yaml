perception_lidar_clustering:
  ros__parameters:
    scan_in_topic: "/scan"
    clusters_out_topic: "/perception/lidar/clusters"
    # Sensor data should not accumulate if downstream processing falls behind.
    scan_queue_size: 5
    # Scored on the static 1,070-scan Isaac mapping scene; recheck with moving
    # obstacles and the physical LiDAR before treating these as general settings.
    # Consecutive valid returns farther apart than this start separate clusters.
    max_adjacent_point_distance_m: 0.20
    # Keep two-beam narrow surfaces; single returns remain excluded.
    min_cluster_points: 2
