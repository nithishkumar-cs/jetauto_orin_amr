# Software scan/TF-health interlock. This is not safety-rated; it prevents
# Nav2 Humble's fail-open monitor from forwarding motion when /scan is missing,
# stale, or not transformable through odom. Keep the operator e-stop last.
scan_health_gate:
  ros__parameters:
    cmd_vel_in_topic: "/cmd_vel/collision_limited"
    cmd_vel_out_topic: "/cmd_vel/scan_health_limited"
    scan_in_topic: "/scan"
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    scan_timeout_sec: 0.3
    future_stamp_tolerance_sec: 0.1
    stop_publish_rate_hz: 20.0
