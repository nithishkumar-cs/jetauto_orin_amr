frames:
  map: map
  odom: odom
  base_link: base_link
  base_footprint: base_footprint
  rgb_camera_link: rgb_camera_link
  rgb_camera_optical_frame: rgb_camera_optical_frame
  depth_camera_link: depth_camera_link
  depth_camera_color_optical_frame: depth_camera_color_optical_frame
  depth_camera_depth_optical_frame: depth_camera_depth_optical_frame
  lidar_link: lidar_link

static_transforms:
  base_link_to_rgb_camera_link:
    parent: base_link
    child: rgb_camera_link
    xyz: [0.18, 0.0, 0.28]
    rpy: [0.0, 0.0, 0.0]
  rgb_camera_link_to_optical:
    parent: rgb_camera_link
    child: rgb_camera_optical_frame
    xyz: [0.0, 0.0, 0.0]
    rpy: [-1.57079632679, 0.0, -1.57079632679]
  base_link_to_depth_camera_link:
    parent: base_link
    child: depth_camera_link
    xyz: [0.20, 0.0, 0.30]
    rpy: [0.0, 0.0, 0.0]
  base_link_to_lidar:
    parent: base_link
    child: lidar_link
    xyz: [0.12, 0.0, 0.18]
    rpy: [0.0, 0.0, 0.0]
