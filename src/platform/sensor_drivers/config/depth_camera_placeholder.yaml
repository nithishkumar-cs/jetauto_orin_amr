# Replace this profile with the vendor depth camera driver once the JetAuto camera is connected.
# The downstream stack expects:
#   /sensors/depth/image_rect
#   /sensors/depth/camera_info
#   /sensors/rgb/image_raw
#   /sensors/rgb/camera_info
depth_camera:
  ros__parameters:
    rgb_frame_id: depth_camera_color_optical_frame
    depth_frame_id: depth_camera_depth_optical_frame
    target_rgb_topic: /sensors/rgb/image_raw
    target_depth_topic: /sensors/depth/image_rect
    target_info_topic: /sensors/depth/camera_info

