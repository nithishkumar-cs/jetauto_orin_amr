defaults:
  instrumentation_mode: debug
  detector_backend_defaults:
    debug: debug
    profile: yolo
    production: yolo
  config_set_by_mode:
    debug: debug_profile
    profile: debug_profile
    production: production

config_sets:
  debug_profile:
    description: Shared development and profiling defaults.
    enable_base_interface: true
    enable_sensor_drivers: true
    enable_preproc: true
    enable_depth_pipeline: false
    enable_teleop: true
    enable_localization: false
    enable_navigation_tasks: false
    enable_benchmarks: false
    base_transport_mode: stub
    localization_mode: mapping

  production:
    description: Full stack defaults with every major subsystem available.
    enable_base_interface: true
    enable_sensor_drivers: true
    enable_preproc: true
    enable_depth_pipeline: true
    enable_teleop: true
    enable_localization: true
    enable_navigation_tasks: true
    enable_benchmarks: true
    base_transport_mode: stub
    localization_mode: mapping
