depth_obstacle_projector_node:
  ros__parameters:
    detections_topic: /perception/detections_2d
    depth_topic: /sensors/depth/image_rect
    camera_info_topic: /sensors/depth/camera_info
    obstacles_topic: /perception/obstacles_3d
    target_frame: base_link
    depth_scale: 0.001
    min_depth_m: 0.15
    max_depth_m: 8.0
    sample_fraction: 0.30
    stale_depth_timeout_s: 0.25
    tf_timeout_s: 0.03

